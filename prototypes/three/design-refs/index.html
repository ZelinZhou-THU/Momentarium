<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momentarium · 高设计感纯环境参考场景</title>
    <style>
      /* Dev harness only（prototypes/three 原型，非产品 UI；产品前端只用 Tailwind）。 */
      :root {
        color-scheme: dark;
        --bg: #0a1118;
        --panel: #111a22;
        --line: #223140;
        --text: #dbe7ee;
        --muted: #8aa0af;
        --accent: #8fb8d2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 "Cascadia Mono", Consolas, "Segoe UI", monospace;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      #status-line {
        color: var(--muted);
        font-size: 12px;
      }
      button {
        font: inherit;
        color: #0a1118;
        background: var(--accent);
        border: 0;
        border-radius: 4px;
        padding: 6px 14px;
        cursor: pointer;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 460px;
        gap: 1px;
        background: var(--line);
      }
      .stage-column,
      .inspector {
        background: var(--bg);
        min-height: 0;
      }
      .stage {
        position: relative;
        aspect-ratio: 16 / 10;
        width: 100%;
        background: #070d12;
      }
      .sandbox-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .inspector {
        padding: 12px 14px 24px;
        max-height: 78vh;
        overflow: auto;
      }
      .inspector h2 {
        margin: 14px 0 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #log-list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 11.5px;
        color: var(--muted);
        max-height: 200px;
        overflow: auto;
      }
      #log-list li {
        padding: 2px 0;
        border-bottom: 1px dashed #1a242e;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 5px 6px;
        text-align: left;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      #captures {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px 16px 24px;
        background: var(--bg);
      }
      #captures figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 8px;
      }
      #captures img {
        width: 100%;
        display: block;
      }
      #captures figcaption {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Momentarium · voxel vs smooth 对比实验 <span style="color: var(--muted)">纯环境 · 无照片实体 · 同沙箱</span></h1>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="status-line">idle</span>
        <button id="run-button" type="button">开始对比</button>
      </div>
    </header>
    <main>
      <div class="stage-column">
        <div class="stage" id="stage"></div>
      </div>
      <aside class="inspector">
        <h2>运行日志</h2>
        <ol id="log-list"></ol>
        <div id="result-section" hidden>
          <h2>运行时指标</h2>
          <table>
            <thead>
              <tr>
                <th>版本</th>
                <th>buildMs</th>
                <th>fps</th>
                <th>drawCalls</th>
                <th>triangles</th>
                <th>照片</th>
                <th>联网</th>
                <th>错误</th>
              </tr>
            </thead>
            <tbody id="metrics-body"></tbody>
          </table>
        </div>
      </aside>
      <div id="captures"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
