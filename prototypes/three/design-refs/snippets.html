<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momentarium · 参考片段评审画廊</title>
    <style>
      /* Dev harness only（prototypes/three 原型，非产品 UI；产品前端只用 Tailwind）。 */
      :root { color-scheme: dark; --bg: #0a1118; --panel: #111a22; --line: #223140; --text: #dbe7ee; --muted: #8aa0af; --accent: #8fb8d2; --ok: #8fd19e; --bad: #f08a7e; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { margin: 0; font-size: 15px; font-weight: 600; }
      header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      #status-line { color: var(--muted); font-size: 12px; }
      button { font: inherit; color: #0a1118; background: var(--accent); border: 0; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
      main { padding: 8px 20px 40px; }
      h2 { margin: 24px 0 10px; font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; }
      .card:hover, .card:focus { border-color: var(--accent); outline: none; }
      .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #070d12; aspect-ratio: 32 / 10; }
      .shots img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .placeholder { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 12px; text-align: center; }
      .card-body { padding: 10px 12px 12px; }
      .card-body h3 { margin: 0; font-size: 14px; font-weight: 600; }
      .chips { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px; }
      .chip { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #1b2733; color: var(--accent); }
      .metrics { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 10px; font: 11.5px "Cascadia Mono", Consolas, monospace; color: var(--muted); min-height: 1em; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
      table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--panel); border: 1px solid var(--line); }
      th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
      th { color: var(--muted); font-weight: 500; }
      /* 渲染舞台必须在屏幕内：跨源 iframe 离屏时浏览器会节流 rAF，fps 会被测成 0。 */
      #capture-stage { position: fixed; right: 16px; bottom: 16px; z-index: 3; width: 640px; height: 400px; border: 1px solid var(--line); background: #070d12; }
      #capture-stage:empty { display: none; }
      .sandbox-frame { width: 100%; height: 100%; border: 0; display: block; }
      #viewer { position: fixed; inset: 0; z-index: 5; display: grid; grid-template-columns: minmax(0, 1fr) 560px; grid-template-rows: auto minmax(0, 1fr); background: rgba(5, 9, 13, 0.96); }
      #viewer[hidden] { display: none; }
      .viewer-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
      .viewer-head h3 { margin: 0; font-size: 14px; }
      #viewer-size { color: var(--muted); font-size: 12px; margin-left: 12px; }
      #viewer-stage { min-height: 0; background: #070d12; position: relative; }
      #viewer-stage .placeholder { height: 100%; }
      .code-pane { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
      #viewer-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
      .tab { background: #1b2733; color: var(--text); padding: 4px 10px; }
      .tab.active { background: var(--accent); color: #0a1118; }
      #viewer-code { margin: 0; padding: 12px; overflow: auto; flex: 1; font: 12px/1.55 "Cascadia Mono", Consolas, monospace; color: #c9d7df; white-space: pre; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>参考片段评审画廊</h1>
        <p>源文件：backend/src/main/resources/scene/snippets/（子代码提示词按题面挑 2–3 段 + toolkit）· 同一沙箱运行时 · 点卡片可拖拽旋转、看源码</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span id="status-line">加载中…</span>
        <button id="run-button" type="button">渲染全部</button>
      </div>
    </header>
    <main>
      <section id="gallery"></section>
      <h2>提示词预算（每段片段的大小与触发关键词）</h2>
      <table>
        <thead><tr><th>id</th><th>内容</th><th>大小</th><th>题面里出现这些词时优先选用</th></tr></thead>
        <tbody id="budget-body"></tbody>
      </table>
    </main>
    <div id="capture-stage" aria-hidden="true"></div>
    <div id="viewer" hidden>
      <div class="viewer-head">
        <div><h3 id="viewer-title" style="display: inline"></h3><span id="viewer-size"></span></div>
        <button id="viewer-close" type="button">关闭（Esc）</button>
      </div>
      <div id="viewer-stage"></div>
      <div class="code-pane">
        <div id="viewer-tabs"></div>
        <pre id="viewer-code"></pre>
      </div>
    </div>
    <script src="snippets-app.js"></script>
  </body>
</html>
